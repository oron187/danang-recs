*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15.5px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}

button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

header.top .btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}

.brand{display:flex;flex-direction:column;gap:1px;min-width:0;text-decoration:none}
.brand h1{font-size:18px;font-weight:700}
.brand span{font-size:12.5px;color:rgba(255,255,255,.66)}

.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-sm{padding:5px 12px;font-size:13.5px}

nav.cats a{display:block;padding:12px 13px 10px;font-size:14.5px;font-weight:500;text-decoration:none;color:rgba(255,255,255,.7);border-bottom:2px solid transparent}

nav.cats a[aria-current="page"]{color:#fff;border-bottom-color:#fff;font-weight:600}

.controls{padding-block:18px 2px}

.search input{border:0;background:transparent;padding:12px 0;width:100%;min-width:0;outline:none}
.search svg{flex:none;color:var(--muted)}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chiprow .lbl{font-size:13.5px;color:var(--muted);font-weight:600;margin-inline-end:3px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.clear{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:600;padding:6px 2px;text-decoration:underline}
.pagehead{margin:22px 0 2px}
.pagehead h2{font-size:26px;font-weight:700;letter-spacing:-.01em}
.pagehead p{color:var(--muted);font-size:14.5px;margin:4px 0 0}
.meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
.count{font-size:14.5px;font-weight:600}
.count em{font-style:normal;color:var(--muted);font-weight:500}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding-bottom:36px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow)}

.tile h3{font-size:17.5px;font-weight:600}
.tile .n{font-size:13px;color:var(--accent);font-weight:600}
.tile p{margin:0;font-size:13.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:12px;padding-bottom:40px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:var(--shadow)}
.card.fresh{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card.hid{opacity:.6;border-style:dashed}
.card h3{font-size:17px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kicker{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0}
.cat{color:var(--accent);font-weight:600;font-size:12.5px}
.hidflag{color:var(--warm);font-weight:600;font-size:12.5px}

.contact{color:var(--accent);font-weight:600;text-decoration:none}
.contact:hover{text-decoration:underline}
.note-text{font-size:14.5px;color:var(--fg);overflow-wrap:anywhere;margin:0}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.t{font-size:12.5px;background:var(--surface-2);border-radius:999px;padding:3px 10px;color:var(--muted)}
.t.hit{background:var(--accent-soft);color:var(--fg);font-weight:600}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:9px;margin-top:auto;font-size:13px;color:var(--muted)}
.byline{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;min-width:0}
.cardfoot a{color:var(--accent);font-weight:600;text-decoration:none}
.cardfoot a:hover{text-decoration:underline}
.cbtn{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0;text-align:start}
.threads{display:flex;flex-direction:column;gap:9px;border-top:1px dashed var(--line);padding-top:9px}
.cmt{background:var(--surface-2);border-radius:10px;padding:9px 12px}

.cform{display:flex;flex-direction:column;gap:7px}

.confirmbox p{margin:0 0 16px;font-size:14.5px;color:var(--muted)}
.confirmfoot{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--header);color:#fff;
  padding:11px 19px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:70;box-shadow:var(--shadow);max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .22s ease}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}

const NEW_DAYS=7, NEW_MAX=6;
function isRecent(pl){
  if(pl.imported||!pl.created_at)return false;
  const age=Date.now()-new Date(pl.created_at).getTime();
  return age>=0 && age<NEW_DAYS*86400000;
}
function recentPlaces(){
  return places.filter(p=>p.status!=="hidden"&&!p.imported&&p.created_at)
    .sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||"")).slice(0,NEW_MAX);
}
const NOISE=/\b(the|a|an|cafe|caf\u00e9|coffee|restaurant|resto|bar|shop|store|da nang|danang|vietnam)\b/g;
const normName=x=>String(x||"").toLowerCase().replace(/[\u0591-\u05C7]/g,"")
  .replace(/[^\p{L}\p{N}]+/gu," ").replace(NOISE," ").replace(/\s+/g," ").trim();
const GENERIC=new Set(["clinic","dental","dentist","market","mart","bakery","hospital","pharmacy","spa",
  "kitchen","food","express","visa","visas","bank","atm","gym","fitness","salon","studio","center","centre",
  "rental","apartments","hotel","\u05db\u05e1\u05e4\u05d5\u05de\u05d8","\u05d5\u05d9\u05d6\u05d5\u05ea","\u05de\u05e1\u05e2\u05d3\u05d4","\u05e7\u05e4\u05d4"]);
function nameScore(a,b){
  if(!a||!b)return 0;
  if(a===b)return 1;
  const ca=a.replace(/\s+/g,""),cb=b.replace(/\s+/g,"");
  if(ca===cb)return .95;
  if(ca.length>4&&cb.length>4&&(ca.includes(cb)||cb.includes(ca)))return .9;
  let A=new Set(a.split(" ")),B=new Set(b.split(" "));
  const sa=new Set([...A].filter(t=>!GENERIC.has(t))),sb=new Set([...B].filter(t=>!GENERIC.has(t)));
  if(sa.size&&sb.size){A=sa;B=sb}
  let hit=0;A.forEach(t=>{if(B.has(t))hit++});
  return hit/Math.max(A.size,B.size);
}
function similarPlaces(raw,skipId){
  const q=normName(raw);
  if(q.length<3)return [];
  return places.filter(p=>p.id!==skipId)
    .map(p=>({p,s:nameScore(q,normName(p.name))}))
    .filter(x=>x.s>=.6).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.p);
}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function niceDate(s){
  if(!s)return"";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  if(m)return m[3]+"/"+m[2]+"/"+m[1];
  const d=new Date(s);if(isNaN(d))return"";
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
}

async function load(){
  let q=db.from("places").select("*").order("created_at",{ascending:false});
  if(!admin)q=q.eq("status","visible");
  const [p,c]=await Promise.all([q,db.from("comments").select("*").order("created_at",{ascending:true})]);
  if(p.error){loadErr=p.error.message}else{places=p.data||[];loadErr=null}
  comments={};
  (c.data||[]).forEach(x=>{(comments[x.place_id]=comments[x.place_id]||[]).push(x)});
  if(admin){const f=await db.from("feedback").select("*").order("created_at",{ascending:false});feedback=f.data||[]}
  else feedback=[];
  updateInbox();render();
}

function chip(label,on){const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=label;b.setAttribute("aria-pressed",on?"true":"false");return b}

function match(pl){
  const tags=pl.tags||[];
  for(const t of state.tags)if(!tags.includes(t))return false;
  if(state.q){
    const body=(comments[pl.id]||[]).map(c=>c.body+" "+c.author).join(" ");
    const h=[pl.name,pl.note,tags.join(" "),tags.map(tagHe).join(" "),catHe(pl.category),pl.added_by,body].join(" ").toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>h.includes(w)))return false}
  return true;
}

function contactHTML(pl){
  const v=(pl.phone||"").trim();
  if(!v)return"";
  if(/^https?:\/\//i.test(v)){
    const wa=/wa\.me|wa\.link|whatsapp/i.test(v);
    return '<p class="kicker"><a class="contact" href="'+esc(v)+'" target="_blank" rel="noopener">'+(wa?"שליחת הודעה בוואטסאפ":"פתיחת הקישור")+'</a></p>';
  }
  const digits=v.replace(/[^\d+]/g,"");
  if(digits.length>=7)return '<p class="kicker"><a class="contact" href="tel:'+esc(digits)+'" dir="ltr">'+esc(v)+'</a></p>';
  return '<p class="kicker" dir="auto">'+esc(v)+'</p>';
}

  c.append(tog);

    const row=document.createElement("div");row.className="adminrow";

      no.onclick=()=>{pendingDelete=null;render()};
      row.append(yes,no);
    }else{
      const ed=document.createElement("button");ed.className="btn btn-sm";ed.textContent="עריכה";
      ed.onclick=()=>openForm(pl);
      const del=document.createElement("button");del.className="btn btn-sm btn-danger";del.textContent="מחיקה";
      del.onclick=()=>{pendingDelete=pl.id;render()};
      row.append(ed,del);

  return c;

async function doDelete(pl){

  places=places.filter(p=>p.id!==pl.id);delete comments[pl.id];pendingDelete=null;render();

  let next="home";
  if(s==="about")next="about";
  else if(s==="inbox"&&admin)next="inbox";
  else if(c)next=c;
  if(next!==route){route=next;state.q="";state.tags.clear();pendingDelete=null;openThreads.clear()}
  render();window.scrollTo(0,0);
}
addEventListener("hashchange",readHash);

$("themeBtn").onclick=()=>{const d=document.documentElement,cur=d.getAttribute("data-theme"),sys=matchMedia("(prefers-color-scheme: dark)").matches;
  d.setAttribute("data-theme",(cur?cur==="dark":sys)?"light":"dark")};
$("signOutBtn").onclick=async()=>{await db.auth.signOut();toast("יצאת מהחשבון")};
$("aboutBtn").onclick=()=>{location.hash="#/about"};

let scrim=null,sheetGuard=null;
function closeSheet(){const c=document.querySelector(".confirm");if(c)c.remove();if(scrim){scrim.remove();scrim=null;sheetGuard=null;document.removeEventListener("keydown",onEsc)}}
function onEsc(e){
  if(e.key!=="Escape")return;
  const c=document.querySelector(".confirm");
  if(c){c.remove();return}
  requestClose();
}
function requestClose(){
  if(!scrim)return;
  if(sheetGuard&&sheetGuard())return askDiscard();
  closeSheet();
}
function askDiscard(){
  if(document.querySelector(".confirm"))return;
  const w=document.createElement("div");w.className="confirm";
  w.innerHTML='<div class="confirmbox" role="alertdialog" aria-modal="true" aria-labelledby="cfT">'+
    '<h2 id="cfT">למחוק את מה שכתבתם?</h2><p>כל מה שהקלדתם יימחק.</p><div class="confirmfoot"></div></div>';
  const foot=w.querySelector(".confirmfoot");
  const keep=document.createElement("button");keep.type="button";keep.className="btn";keep.textContent="חזרה לעריכה";
  const toss=document.createElement("button");toss.type="button";toss.className="btn btn-danger";toss.textContent="מחיקה";
  keep.onclick=()=>w.remove();
  toss.onclick=()=>{w.remove();closeSheet()};
  foot.append(keep,toss);
  w.addEventListener("click",e=>{if(e.target===w)w.remove()});
  document.body.append(w);keep.focus();
}
function openSheet(html){
  closeSheet();
  scrim=document.createElement("div");scrim.className="scrim";
  scrim.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.append(scrim);
  document.addEventListener("keydown",onEsc);
  scrim.addEventListener("click",e=>{if(e.target===scrim)requestClose()});
}

function openFeedback(kind){
  const bug=kind==="bug";
  openSheet('<h2>'+(bug?"דיווח על תקלה":"רעיון לשיפור")+'</h2>'+
   '<div class="sub">'+(bug?"מה לא עבד, ומה ניסיתם לעשות כשזה קרה?":"מה יעשה את האתר שימושי יותר בשבילכם?")+'</div>'+
   '<form id="fbForm">'+
   '<div class="field"><label for="fb_body">'+(bug?"מה קרה":"הרעיון שלכם")+'</label><textarea id="fb_body" dir="auto" maxlength="1000" required></textarea></div>'+
   '<div class="field"><label for="fb_by">השם שלכם</label><input id="fb_by" maxlength="60" placeholder="לא חובה, אבל עוזר אם צריך לשאול משהו"></div>'+
   '<div class="sheetfoot"><button type="button" class="btn" id="cancelBtn">ביטול</button><button type="submit" class="btn btn-primary" id="fbSend">שליחה</button></div>'+
   '</form>');
  $("cancelBtn").onclick=requestClose;
  try{const n=localStorage.getItem("danang_name");if(n)$("fb_by").value=n}catch(e){}
  const snap=()=>$("fb_body").value+"\u0000"+$("fb_by").value;
  const initial=snap();sheetGuard=()=>snap()!==initial;
  $("fb_body").focus();
  $("fbForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const b=$("fbSend");b.disabled=true;b.textContent="שולח…";
    const row={kind:kind,body:$("fb_body").value.trim(),author:$("fb_by").value.trim()||null,page:(location.hash||"#/").slice(0,120)};
    const {error}=await db.from("feedback").insert(row);
    if(error){b.disabled=false;b.textContent="שליחה";toast("לא הצלחנו לשלוח — "+error.message);return}
    try{if(row.author)localStorage.setItem("danang_name",row.author)}catch(e){}
    sheetGuard=null;closeSheet();
    toast(bug?"תודה — הדיווח נשלח":"תודה — הרעיון נשלח");
  });
}
$("bugBtn").onclick=()=>openFeedback("bug");
$("ideaBtn").onclick=()=>openFeedback("idea");
$("bugBtn2").onclick=()=>openFeedback("bug");
$("ideaBtn2").onclick=()=>openFeedback("idea");
$("inboxBtn").onclick=()=>{location.hash="#/inbox"};

function renderInbox(){
  const v=$("view");
  v.innerHTML='<div class="pagehead"><h2>פניות</h2><p>תקלות ורעיונות שנשלחו מהאתר. רק אתה רואה אותם.</p></div><div class="fb" id="fbList"></div>';
  const l=$("fbList");
  if(!feedback.length){l.innerHTML='<div class="empty"><h3>אין עדיין פניות</h3><p>דיווחים ורעיונות מהקבוצה יופיעו כאן.</p></div>';return}
  feedback.forEach(f=>{
    const d=document.createElement("div");d.className="fbitem"+(f.status==="done"?" done":"");
    d.innerHTML='<div class="fbtop"><span class="fbkind '+(f.kind==="bug"?"bug":"")+'">'+(f.kind==="bug"?"תקלה":"רעיון")+'</span>'+
      '<span>'+niceDate(f.created_at)+'</span>'+(f.author?'<span dir="auto">'+esc(f.author)+'</span>':'')+
      (f.page&&f.page!=="#/"?'<span dir="ltr">'+esc(f.page)+'</span>':'')+'</div>'+
      '<p class="note-text" dir="auto">'+esc(f.body)+'</p>';
    const row=document.createElement("div");row.className="adminrow";
    const mark=document.createElement("button");mark.className="btn btn-sm";mark.textContent=f.status==="done"?"פתיחה מחדש":"סימון כטופל";
    mark.onclick=async()=>{
      const next=f.status==="done"?"open":"done";
      const {error}=await db.from("feedback").update({status:next}).eq("id",f.id);
      if(error){toast("לא הצלחנו לעדכן — "+error.message);return}
      f.status=next;updateInbox();render();
    };
    const del=document.createElement("button");del.className="btn btn-sm btn-danger";del.textContent="מחיקה";
    del.onclick=async()=>{
      const {error}=await db.from("feedback").delete().eq("id",f.id);
      if(error){toast("לא הצלחנו למחוק — "+error.message);return}
      feedback=feedback.filter(x=>x.id!==f.id);updateInbox();render();toast("נמחק");
    };
    row.append(mark,del);d.append(row);l.append(d);
  });
}

function openSignIn(){
  openSheet('<h2>כניסת מנהל</h2><div class="sub">נשלח לכם קישור במייל. פתחו אותו במכשיר הזה.</div>'+
    '<form id="signinForm"><div class="field"><label for="f_em">כתובת מייל</label><input id="f_em" type="email" dir="ltr" required placeholder="you@example.com"></div>'+
    '<div class="sheetfoot"><button type="button" class="btn" id="cancelBtn">ביטול</button><button type="submit" class="btn btn-primary" id="linkBtn">שליחת קישור</button></div></form>');
  $("cancelBtn").onclick=requestClose;$("f_em").focus();
  $("signinForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const b=$("linkBtn");b.disabled=true;b.textContent="שולח…";
    const {error}=await db.auth.signInWithOtp({email:$("f_em").value.trim(),options:{emailRedirectTo:location.origin+location.pathname}});
    closeSheet();
    toast(error?("לא הצלחנו לשלוח — "+error.message):"נשלח קישור למייל");
  });
}

function openForm(pl){
  const editing=!!pl;
  openSheet('<h2>'+(editing?"עריכת מקום":"הוספת מקום")+'</h2>'+
   (editing?'<div class="sub">השינויים נכנסים לאתר מיד.</div>'
          :'<div class="bar"><b>רק מקומות ששווה לנסוע בשבילם.</b> כאלה שהייתם בהם בעצמכם והייתם חוזרים אליהם.</div>')+
   '<form id="placeForm">'+
   '<div class="two"><div class="field"><label for="f_n">שם המקום</label><input id="f_n" required dir="auto" placeholder="למשל Nam House Coffee"></div>'+
   '<div class="field"><label for="f_d">מתי היית</label><input id="f_d" type="date" required></div></div>'+
   '<div class="dupe" id="dupe" hidden></div>'+
   '<div class="field"><label for="f_c">קטגוריה</label><select id="f_c">'+CATEGORIES.map(c=>'<option value="'+c.name+'">'+c.he+'</option>').join("")+'</select></div>'+
   '<div class="field"><label>סינון</label><div class="chiprow" id="f_tags" style="margin-top:0"></div><span class="hint">סמנו כל מה שמתאים — לפי זה אנשים מחפשים.</span></div>'+
   '<div class="field"><label for="f_u">קישור</label><input id="f_u" type="url" dir="ltr" placeholder="https://maps.app.goo.gl/…"></div>'+
   '<div class="field"><label for="f_ph">טלפון או וואטסאפ</label><input id="f_ph" maxlength="200" dir="ltr" placeholder="+84 90 123 4567 או קישור wa.me"></div>'+
   '<div class="field"><label for="f_x">למה שווה ללכת לשם</label><textarea id="f_x" dir="auto" maxlength="600"></textarea><span class="hint">מחיר — רק אם הוא באמת העניין. נשארו <span id="cc">600</span> תווים.</span></div>'+
   '<div class="two even"><div class="field"><label for="f_by">ממליץ/ה</label><input id="f_by" required maxlength="60" placeholder="כדי שידעו מי היה שם"></div>'+
   (admin?'<div class="field"><label for="f_st">נראות</label><select id="f_st"><option value="visible">מוצג</option><option value="hidden">מוסתר</option></select></div>':'<div></div>')+'</div>'+
   '<div class="sheetfoot"><button type="button" class="btn" id="cancelBtn">ביטול</button><button type="submit" class="btn btn-primary" id="saveBtn">'+(editing?"שמירת השינויים":"הוספה")+'</button></div>'+
   '</form>');
  $("cancelBtn").onclick=requestClose;
  const chosen=new Set(editing?(pl.tags||[]):[]);
  const snap=()=>["f_n","f_d","f_c","f_u","f_ph","f_x","f_by","f_st"].map(id=>{const el=$(id);return el?el.value:""}).join("\u0000")+"\u0000"+[...chosen].sort().join(",");
  const paint=()=>{const box=$("f_tags");box.innerHTML="";
    (byName($("f_c").value)||CATEGORIES[0]).tags.forEach(t=>{const b=chip(tagHe(t),chosen.has(t));b.onclick=()=>{chosen.has(t)?chosen.delete(t):chosen.add(t);paint()};box.append(b)})};
  $("f_d").value=(editing&&pl.visited_on)?pl.visited_on:today();
  if(editing){
    $("f_n").value=pl.name||"";$("f_c").value=pl.category;
    $("f_u").value=pl.url||"";$("f_ph").value=pl.phone||"";$("f_x").value=pl.note||"";
    $("f_by").value=pl.added_by||"";if($("f_st"))$("f_st").value=pl.status||"visible";
    $("cc").textContent=600-($("f_x").value.length);
  }else if(route!=="home"&&route!=="inbox"&&route!=="about")$("f_c").value=route.name;
  $("f_c").addEventListener("change",()=>{
    const keep=[...chosen].filter(t=>(byName($("f_c").value)||{tags:[]}).tags.includes(t));
    chosen.clear();keep.forEach(t=>chosen.add(t));paint()});
  paint();
  $("f_x").addEventListener("input",e=>{$("cc").textContent=600-e.target.value.length});
  const dupeBox=$("dupe");let dupeTimer=null;
  const paintDupes=()=>{
    const hits=similarPlaces($("f_n").value,editing?pl.id:null);
    if(!hits.length){dupeBox.hidden=true;dupeBox.innerHTML="";return}
    dupeBox.hidden=false;
    dupeBox.innerHTML='<b>יש כבר משהו דומה באתר</b><ul>'+
      hits.map(h=>'<li dir="auto">'+esc(h.name)+' <span>· '+esc(catHe(h.category))+'</span></li>').join("")+
      '</ul><span class="hint">אם זה אותו מקום — עדיף להוסיף תגובה על הרשומה הקיימת במקום להוסיף אותו שוב.</span>';
  };
  $("f_n").addEventListener("input",()=>{clearTimeout(dupeTimer);dupeTimer=setTimeout(paintDupes,220)});
  if(editing)paintDupes();
  if(!editing){try{const n=localStorage.getItem("danang_name");if(n)$("f_by").value=n}catch(e){}}
  const initial=snap();sheetGuard=()=>snap()!==initial;
  $("f_n").focus();
  $("placeForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=$("saveBtn");btn.disabled=true;btn.textContent="שומר…";
    const row={name:$("f_n").value.trim(),category:$("f_c").value,tags:[...chosen],visited_on:$("f_d").value||null,
      url:$("f_u").value.trim()||null,phone:$("f_ph").value.trim()||null,note:$("f_x").value.trim()||null,added_by:$("f_by").value.trim()};
    if(admin&&$("f_st"))row.status=$("f_st").value;
    try{
      let saved;
      if(editing){
        const {data,error}=await db.from("places").update(row).eq("id",pl.id).select().single();
        if(error)throw error;saved=data;places=places.map(p=>p.id===saved.id?saved:p);
      }else{
        const {data,error}=await db.from("places").insert(row).select().single();
        if(error)throw error;saved=data;saved.justAdded=true;places.unshift(saved);
        try{localStorage.setItem("danang_name",row.added_by)}catch(e){}
      }
      sheetGuard=null;closeSheet();
      const cat=byName(saved.category);
      state.q="";state.tags.clear();
      if(cat&&location.hash!=="#/"+cat.slug&&!editing){location.hash="#/"+cat.slug}else{render()}
      toast(editing?"נשמר":"נוסף — תודה");
    }catch(err){
      btn.disabled=false;btn.textContent=editing?"שמירת השינויים":"הוספה";
      toast("לא הצלחנו לשמור — "+(err.message||"בדקו את שדה הקישור ונסו שוב"));
    }
  });
}
$("addBtn").onclick=()=>openForm(null);

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3200)}
readHash();
refreshAuth();
</script>
